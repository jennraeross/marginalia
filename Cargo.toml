[package]
name = "marginalia"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Cross-platform EPUB library + reader with FanFicFare support"

[dependencies]
eframe = "0.37"
egui = "0.37"
egui_extras = "0.37"
rusqlite = { version = "0.42", features = ["bundled"] }
roxmltree = "0.21"
sha2 = "0.11"
hex = "0.4"
directories = "6.0"
rfd = "0.18"
scraper = "0.29"
html-escape = "0.2"
image = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
chrono = "0.4"
tempfile = "3"
zip = "2"
tts = "0.26.3"

[package.metadata.packager]
before-packaging-command = "cargo build --release"
product-name = "Marginalia"
identifier = "com.jennraeross.marginalia"
description = "Cross-platform EPUB library + reader with FanFicFare support"
license-file = "LICENSE"
out-dir = "dist"
icons = ["assets/icon-512.png"]
